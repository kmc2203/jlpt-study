name: 학습 알림

on:
  schedule:
    - cron: "30 2 * * *"    # 오전 11:30 KST
    - cron: "30 6 * * *"    # 오후 15:30 KST
    - cron: "30 12 * * *"   # 밤 21:30 KST
  workflow_dispatch:
    inputs:
      slot:
        description: "알림 시간대 (morning / afternoon / night, 비우면 지금 시각 기준)"
        required: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: 알림 보내기
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          PUSH_SLOT: ${{ github.event.inputs.slot }}
        run: node scripts/send_push.mjs
